# electric-eye per-application allowlist
#
# Format: <installed-name-or-executable> <subject-prefix>
# Exemptions require the kernel-observed device/inode of a protected root-owned
# executable. Process names and desktop labels cannot grant exemptions.
# A prefix of "*" grants a broad exemption for that verified executable.
# Lines are comments; matching is literal and case-sensitive.
#
# System authentication helpers reading /etc/shadow, /etc/passwd and
# /etc/gshadow are allowed by built-in defaults. The built-in noise allowlist
# also covers tailscaled, thunar, git and cargo; disable it in config.toml with
# builtin_noise_allowlist = false. ssh is not globally allowed: verified SSH
# destinations can be approved through asynchronously cached known_hosts data.
# Add local exceptions below.
#
# Examples:
# firefox /home/you/.mozilla/firefox
# syncthing /home/you/Sync
# cargo /home/you/src/project/target
