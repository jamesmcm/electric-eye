[workspace]
resolver = "2"
members = [
    "crates/electric-eyed",
    "crates/electric-eye-cli",
    "crates/electric-eye-core",
    "crates/electric-eye-nix",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
